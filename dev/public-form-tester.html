<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SolicitudPro · Comprobador de formularios dev</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f4f7fb;
        color: #172033;
      }

      * { box-sizing: border-box; }

      body { margin: 0; min-width: 320px; }

      main { max-width: 760px; margin: 0 auto; padding: 40px 20px 64px; }

      .eyebrow { color: #286b5e; font-size: 13px; font-weight: 700; letter-spacing: 0; text-transform: uppercase; }
      h1 { margin: 8px 0; font-size: clamp(27px, 5vw, 38px); line-height: 1.1; }
      .lead { margin: 0; max-width: 620px; color: #596579; line-height: 1.55; }

      .notice {
        margin: 24px 0;
        padding: 13px 15px;
        border: 1px solid #f0c878;
        border-radius: 8px;
        background: #fff8e8;
        color: #785114;
        font-size: 14px;
        font-weight: 650;
      }

      form, .result {
        border: 1px solid #dbe2eb;
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 8px 24px rgba(26, 39, 62, 0.06);
      }

      form { padding: 24px; }
      .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
      .form-grid .full { grid-column: 1 / -1; }
      label { display: grid; gap: 7px; font-size: 14px; font-weight: 700; color: #344056; }
      input, select, button { font: inherit; }
      input, select {
        width: 100%;
        min-height: 42px;
        border: 1px solid #bac6d6;
        border-radius: 6px;
        padding: 9px 10px;
        background: #fff;
        color: #172033;
      }
      input:focus, select:focus, button:focus-visible { outline: 3px solid rgba(35, 111, 97, 0.22); outline-offset: 2px; }
      .hint { margin: 0; color: #6d788a; font-size: 13px; line-height: 1.4; }
      .key-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: end; }
      .actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 24px; }
      button { min-height: 42px; border: 1px solid transparent; border-radius: 6px; padding: 9px 14px; font-weight: 750; cursor: pointer; transition: background 150ms ease, border-color 150ms ease, transform 150ms ease; }
      button:hover { transform: translateY(-1px); }
      button:active { transform: translateY(0); }
      button:disabled { cursor: wait; opacity: 0.65; transform: none; }
      .primary { background: #1e6a5d; color: #fff; }
      .primary:hover { background: #155449; }
      .secondary { border-color: #bac6d6; background: #f9fbfd; color: #344056; }
      .secondary:hover { border-color: #8292a8; background: #f1f5f9; }
      .result { margin-top: 20px; padding: 18px 20px; }
      .result h2 { margin: 0 0 6px; font-size: 17px; }
      .result p { margin: 6px 0; line-height: 1.45; }
      .result.ok { border-left: 4px solid #1e8a63; }
      .result.error { border-left: 4px solid #bd4b4b; }
      code { display: block; overflow-wrap: anywhere; margin-top: 10px; padding: 10px; border-radius: 5px; background: #f3f6fa; color: #3e4b5d; font-size: 12px; white-space: pre-wrap; }

      @media (max-width: 580px) {
        main { padding: 28px 16px 48px; }
        form { padding: 18px; }
        .form-grid, .key-row { grid-template-columns: 1fr; }
        .key-row button { width: 100%; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">SolicitudPro · Desarrollo</div>
      <h1>Comprobador de formulario público</h1>
      <p class="lead">Envía datos ficticios al endpoint de desarrollo para revisar el flujo completo antes de conectar cualquier interfaz comercial.</p>
      <p class="notice">Formulario aislado de desarrollo. No usar con datos reales.</p>

      <form id="tester-form" novalidate>
        <div class="form-grid">
          <label class="full" for="scenario">
            Negocio de prueba
            <select id="scenario" name="scenario">
              <option value="reformas">Reformas Demo Dev · solicitud</option>
              <option value="academias">Academia Demo Dev · clases</option>
            </select>
          </label>

          <label for="display-name">
            Nombre
            <input id="display-name" name="display_name" autocomplete="name" required value="Prueba manual dev">
          </label>

          <label for="email">
            Email
            <input id="email" name="email" type="email" autocomplete="email" value="prueba.manual@solicitudpro.test">
          </label>

          <label class="full" for="phone">
            Teléfono <span class="hint">Opcional si indicas email.</span>
            <input id="phone" name="phone" type="tel" autocomplete="tel" value="">
          </label>

          <div id="sector-fields" class="full form-grid" aria-live="polite"></div>

          <label class="full" for="idempotency-key">
            Clave de idempotencia
            <div class="key-row">
              <input id="idempotency-key" name="idempotency_key" spellcheck="false" required>
              <button class="secondary" type="button" id="new-key">Generar nueva clave</button>
            </div>
            <span class="hint">Conserva esta clave para repetir exactamente el envío; genera otra para crear una solicitud distinta.</span>
          </label>
        </div>

        <div class="actions">
          <button class="primary" type="submit" id="submit-button">Enviar solicitud de prueba</button>
          <button class="secondary" type="button" id="fill-example">Rellenar ejemplo seguro</button>
          <span class="hint" id="status-text" aria-live="polite"></span>
        </div>
      </form>

      <section class="result" id="result" hidden aria-live="polite">
        <h2 id="result-title"></h2>
        <p id="result-message"></p>
        <code id="result-details"></code>
      </section>
    </main>

    <script>
      const endpointBase = "https://rinrgjancwvcvpzjyqmu.supabase.co/functions/v1/receive-public-form/api/public/forms";
      const scenarioConfig = {
        reformas: {
          businessSlug: "reformas-demo-dev",
          formSlug: "solicitud",
          submitLabel: "Enviar solicitud de reforma",
          fields: [
            { key: "tipo_reforma", label: "Tipo de reforma", type: "select", options: ["Baño", "Cocina", "Reforma parcial", "Otro"], value: "Baño" },
            { key: "zona", label: "Zona", type: "text", value: "Valencia" },
          ],
        },
        academias: {
          businessSlug: "academia-demo-dev",
          formSlug: "clases",
          submitLabel: "Enviar solicitud de clases",
          fields: [
            { key: "materia", label: "Materia", type: "select", options: ["Inglés", "Matemáticas", "Otra"], value: "Inglés" },
            { key: "disponibilidad", label: "Disponibilidad", type: "text", value: "Tardes" },
          ],
        },
      };

      const form = document.querySelector("#tester-form");
      const scenario = document.querySelector("#scenario");
      const sectorFields = document.querySelector("#sector-fields");
      const idempotencyKey = document.querySelector("#idempotency-key");
      const submitButton = document.querySelector("#submit-button");
      const statusText = document.querySelector("#status-text");
      const result = document.querySelector("#result");
      const resultTitle = document.querySelector("#result-title");
      const resultMessage = document.querySelector("#result-message");
      const resultDetails = document.querySelector("#result-details");

      function makeIdempotencyKey() {
        return `tester-dev-${crypto.randomUUID()}`;
      }

      function safeFieldId(key) {
        return `answer-${key.replace(/[^a-z0-9_-]/gi, "-")}`;
      }

      function renderSectorFields() {
        const config = scenarioConfig[scenario.value];
        submitButton.textContent = config.submitLabel;
        sectorFields.replaceChildren();

        config.fields.forEach((field) => {
          const label = document.createElement("label");
          label.htmlFor = safeFieldId(field.key);
          label.textContent = field.label;

          const input = field.type === "select" ? document.createElement("select") : document.createElement("input");
          input.id = safeFieldId(field.key);
          input.name = field.key;
          input.required = true;

          if (field.type === "select") {
            field.options.forEach((option) => {
              const optionElement = document.createElement("option");
              optionElement.value = option;
              optionElement.textContent = option;
              input.append(optionElement);
            });
          } else {
            input.type = "text";
          }

          input.value = field.value;
          label.append(input);
          sectorFields.append(label);
        });
      }

      function showResult(title, message, details, isError) {
        result.hidden = false;
        result.className = `result ${isError ? "error" : "ok"}`;
        resultTitle.textContent = title;
        resultMessage.textContent = message;
        resultDetails.textContent = details;
      }

      function getPayload() {
        const config = scenarioConfig[scenario.value];
        const contact = {
          display_name: form.elements.display_name.value.trim(),
          email: form.elements.email.value.trim(),
          phone: form.elements.phone.value.trim(),
        };
        const answers = Object.fromEntries(config.fields.map((field) => [field.key, form.elements[field.key].value.trim()]));

        if (!contact.display_name || (!contact.email && !contact.phone)) {
          throw new Error("Indica el nombre y al menos un email o teléfono de prueba.");
        }
        if (Object.values(answers).some((value) => !value)) {
          throw new Error("Completa los campos obligatorios del formulario seleccionado.");
        }

        return {
          contact,
          answers,
          metadata: { source: "public_form_tester_dev" },
          privacy_notice_version: "dev-tester-2026-08",
        };
      }

      scenario.addEventListener("change", () => {
        renderSectorFields();
        showResult("Formulario preparado", "Los campos visibles coinciden con la configuración mínima actual de desarrollo.", "No se ha enviado ninguna solicitud.", false);
      });

      document.querySelector("#new-key").addEventListener("click", () => {
        idempotencyKey.value = makeIdempotencyKey();
        statusText.textContent = "Nueva clave preparada.";
      });

      document.querySelector("#fill-example").addEventListener("click", () => {
        form.elements.display_name.value = "Prueba manual dev";
        form.elements.email.value = "prueba.manual@solicitudpro.test";
        form.elements.phone.value = "";
        renderSectorFields();
        statusText.textContent = "Ejemplo ficticio preparado.";
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        let payload;

        try {
          payload = getPayload();
        } catch (error) {
          showResult("Revisa los datos", error.message, "No se ha realizado ninguna petición.", true);
          return;
        }

        const config = scenarioConfig[scenario.value];
        const key = idempotencyKey.value.trim();
        if (!key) {
          showResult("Falta la clave de idempotencia", "Genera o escribe una clave antes de enviar.", "No se ha realizado ninguna petición.", true);
          return;
        }

        submitButton.disabled = true;
        statusText.textContent = "Enviando al entorno de desarrollo…";
        result.hidden = true;

        try {
          const response = await fetch(`${endpointBase}/${config.businessSlug}/${config.formSlug}/requests`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Idempotency-Key": key,
            },
            body: JSON.stringify(payload),
            credentials: "omit",
          });
          const body = await response.json().catch(() => ({}));
          const details = JSON.stringify({ status: response.status, response: body }, null, 2);

          if (!response.ok) {
            showResult("El endpoint rechazó la prueba", body.error || "No se pudo enviar la solicitud.", details, true);
            statusText.textContent = "La prueba no creó una solicitud.";
            return;
          }

          showResult(
            response.status === 200 ? "Reintento idempotente" : "Solicitud enviada",
            body.message || "El endpoint ha confirmado la solicitud.",
            details,
            false,
          );
          statusText.textContent = response.status === 200 ? "No se creó un duplicado." : "Solicitud creada en Supabase de desarrollo.";
        } catch {
          showResult("No se pudo conectar", "Comprueba que este archivo se sirve desde un origen local permitido y que el endpoint de desarrollo sigue activo.", "No se han expuesto detalles internos.", true);
          statusText.textContent = "Error de conexión.";
        } finally {
          submitButton.disabled = false;
        }
      });

      idempotencyKey.value = makeIdempotencyKey();
      renderSectorFields();
    </script>
  </body>
</html>
